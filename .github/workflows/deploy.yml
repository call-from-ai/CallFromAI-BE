name: Deploy Spring Boot to EC2

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build -x test

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USERNAME: ${{ secrets.EC2_USERNAME }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          AI_SERVER_BASE_URL: ${{ secrets.AI_SERVER_BASE_URL }}
          AI_INTERNAL_TOKEN: ${{ secrets.AI_INTERNAL_TOKEN }}
          CLOVA_SPEECH_SECRET: ${{ secrets.CLOVA_SPEECH_SECRET }}
          CLOVA_VOICE_CLIENT_ID: ${{ secrets.CLOVA_VOICE_CLIENT_ID }}
          CLOVA_VOICE_CLIENT_SECRET: ${{ secrets.CLOVA_VOICE_CLIENT_SECRET }}
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          set -e

          echo "$EC2_SSH_KEY" > private_key.pem
          chmod 600 private_key.pem

          jar_file=$(find build/libs -name '*.jar' ! -name '*plain.jar' | head -n 1)

          cat > deploy.env <<EOF
          DB_URL=$DB_URL
          DB_USERNAME=$DB_USERNAME
          DB_PASSWORD=$DB_PASSWORD
          JWT_SECRET=$JWT_SECRET
          AI_SERVER_BASE_URL=$AI_SERVER_BASE_URL
          AI_INTERNAL_TOKEN=$AI_INTERNAL_TOKEN
          CLOVA_SPEECH_SECRET=$CLOVA_SPEECH_SECRET
          CLOVA_VOICE_CLIENT_ID=$CLOVA_VOICE_CLIENT_ID
          CLOVA_VOICE_CLIENT_SECRET=$CLOVA_VOICE_CLIENT_SECRET
          AWS_S3_BUCKET=$AWS_S3_BUCKET
          AWS_REGION=$AWS_REGION
          AWS_ACCESS_KEY_ID=$AWS_ACCESS_KEY_ID
          AWS_SECRET_ACCESS_KEY=$AWS_SECRET_ACCESS_KEY
          EOF

          scp -i private_key.pem -o StrictHostKeyChecking=no "$jar_file" $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/BackEnd.jar.new
          scp -i private_key.pem -o StrictHostKeyChecking=no deploy.env $EC2_USERNAME@$EC2_HOST:/home/$EC2_USERNAME/.env

          ssh -i private_key.pem -o StrictHostKeyChecking=no $EC2_USERNAME@$EC2_HOST 'bash -s' <<'REMOTE_SCRIPT'
          set -e

          APP_DIR="$HOME"
          chmod 600 "$APP_DIR/.env"
          mv "$APP_DIR/BackEnd.jar.new" "$APP_DIR/BackEnd.jar"
          
          sudo systemctl restart backend

          echo "새 애플리케이션 기동 대기 중..."
          SUCCESS=0
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "헬스체크 성공"
              SUCCESS=1
              break
            fi
            echo "기동 대기 중... ($i/30)"
            sleep 2
          done

          if [ "$SUCCESS" -ne 1 ]; then
            echo "헬스체크 실패: 60초 내에 정상 기동되지 않음"
            echo "----- backend 서비스 로그 마지막 50줄 -----"
            sudo journalctl -u backend -n 50 --no-pager
            exit 1
          fi
          REMOTE_SCRIPT

          rm -f private_key.pem deploy.env