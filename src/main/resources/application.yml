spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

clova:
  speech:
    host: clovaspeech-gw.ncloud.com
    port: 50051
    secret-key: ${CLOVA_SPEECH_SECRET}
    # 턴 끝 감지: 이만큼(ms) 침묵하면 final(epdType=gap) 확정. 지연 vs 조기컷의 다이얼 — 실사용하며 튜닝.
    gap-threshold-ms: 700
  voice:
    base-url: https://naveropenapi.apigw.ntruss.com
    client-id: ${CLOVA_VOICE_CLIENT_ID}
    client-secret: ${CLOVA_VOICE_CLIENT_SECRET}
    format: wav
    sampling-rate: 24000
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

call:
  reservation:
    # 예약 폴링 주기(ms). 예약 시각 대비 최대 이만큼 늦게 발신된다.
    scheduler-delay-ms: 60000
    # 예약 시각이 이 분보다 더 지났으면 발신하지 않고 CANCELED로 종결한다(재기동 시 몰림 발신 방지).
    grace-minutes: 5
  timeout:
    # 연결되지 못한 통화를 걷는 주기(ms). 벨 타임아웃보다 촘촘해야 판정이 제시간에 떨어진다.
    scheduler-delay-ms: 10000
    # 이 초만큼 벨이 울렸는데 안 받으면 부재중(MISSED). 기준 시각은 Call.createdAt(= 벨 울린 시각).
    ring-seconds: 60
    # 받았지만(PENDING) 이 초 안에 WebSocket을 열지 않으면 CANCELED. wsTicket TTL(30초) + 여유.
    pending-seconds: 60

kakao:
  base-url: https://kapi.kakao.com

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
