spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

clova:
  speech:
    host: clovaspeech-gw.ncloud.com
    port: 50051
    secret-key: ${CLOVA_SPEECH_SECRET}
  voice:
    base-url: https://naveropenapi.apigw.ntruss.com
    client-id: ${CLOVA_VOICE_CLIENT_ID}
    client-secret: ${CLOVA_VOICE_CLIENT_SECRET}
    format: wav
    sampling-rate: 24000

kakao:
  base-url: https://kapi.kakao.com
