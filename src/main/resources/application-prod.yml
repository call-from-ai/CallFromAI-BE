spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 최초 update, 이후 validate로 수정
    show-sql: false
    open-in-view: false
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}   # 예: https://myservice.com,https://admin.myservice.com

test:
  access:
    secret: ${TEST_ACCESS_SECRET}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:60000}
    # 스트리밍(/chat/stream)은 "조각 사이 침묵"의 상한이라 단발보다 짧다. 통화 워커가 통화당 단일
    # 스레드라, 죽은 스트림을 오래 붙잡으면 그 통화가 그동안 벙어리가 된다.
    stream-read-timeout-ms: ${AI_SERVER_STREAM_READ_TIMEOUT_MS:15000}
    internal-token: ${AI_INTERNAL_TOKEN}

logging:
  level:
    org.hibernate.SQL: warn
