spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate # 최초 update, 이후 validate로 수정
    show-sql: false
    open-in-view: false
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}   # 예: https://myservice.com,https://admin.myservice.com

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:60000}
    internal-token: ${AI_INTERNAL_TOKEN}

logging:
  level:
    org.hibernate.SQL: warn
