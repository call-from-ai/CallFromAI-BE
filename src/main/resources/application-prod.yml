spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}   # 예: https://myservice.com,https://admin.myservice.com

logging:
  level:
    org.hibernate.SQL: warn
