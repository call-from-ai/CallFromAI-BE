spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB       # 이미지 1장 한도
      max-request-size: 12MB    # 파일 + 텍스트 + multipart 오버헤드 여유

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

clova:
  speech:
    host: clovaspeech-gw.ncloud.com
    port: 50051
    secret-key: ${CLOVA_SPEECH_SECRET}
    # 턴 끝 감지: 이만큼(ms) 침묵하면 final(epdType=gap) 확정. 지연 vs 조기컷의 다이얼 — 실사용하며 튜닝.
    gap-threshold-ms: 700
  # ⚠ 2026-08-06 TTS를 Typecast로 교체하며 비활성화. 지우지 않은 이유는 롤백이다 —
  # 되살릴 땐 아래 주석을 풀고 typecast 블록을 지우면 된다(환경변수 두 개도 다시 필요하다).
  # ⚠ 주석인 채로 두면 CLOVA_VOICE_* 환경변수가 없어도 기동한다 — 주석을 풀면 다시 필수가 된다.
  # voice:
  #   base-url: https://naveropenapi.apigw.ntruss.com
  #   client-id: ${CLOVA_VOICE_CLIENT_ID}
  #   client-secret: ${CLOVA_VOICE_CLIENT_SECRET}
  #   format: wav
  #   sampling-rate: 24000
  #   connect-timeout-ms: 2000
  #   read-timeout-ms: 10000

typecast:
  voice:
    base-url: https://api.typecast.ai
    api-key: ${TYPECAST_API_KEY}
    model: ssfm-v30
    # ISO 639-3. 통화는 한국어 고정 — 생략하면 짧은 대사에서 자동 감지가 오판할 수 있다.
    language: kor
    # ⚠ 샘플레이트는 설정이 없다. 표준 TTS는 44.1kHz 16-bit 모노 고정이다(요청으로 못 바꾼다).
    audio-format: wav
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

call:
  barge-in:
    # 사용자가 끼어들었는지 판정하는 값 둘. 업스트림 PCM 에너지만 본다(STT와 무관 — #139).
    # ⚠ CLOVA 설정(clova.speech.*) 아래에 두지 않는다: 트리거를 STT에서 떼어낸 게 이 기능의 핵심이라,
    #    같은 자리에 두면 다음 사람이 다시 엮는다.
    # 이 RMS 진폭(0~32767)을 넘겨야 "소리 있음".
    # 올리면 잡음에 둔감해지지만 작게 말하는 사용자의 끼어들기를 놓친다.
    rms-threshold: 1200
    # 그 소리가 연속으로 이만큼(ms) 이어져야 "말 시작". 클릭·기침 같은 짧은 잡음을 걸러낸다.
    # ⚠ 크게 잡으면 그만큼 AI가 늦게 멈춘다 — 끼어들기는 200~300ms 안에 멈춰야 자연스럽다.
    min-speech-ms: 60
  artifact:
    # 통화 종료 후 만들어지는 산출물(녹음 업로드·요약 생성)을 기다리는 상한(ms).
    # 쓰는 곳 둘: ⓐ 통화 상세 조회 GET /calls/{id}?wait=true ⓑ 통화 종료 응답 PATCH /calls/{id}/end.
    # 덕분에 프론트가 폴링 없이 한 번의 조회로 audioUrl·aiSummary를 받는다.
    # ⚠ 상한을 넘겨도 취소하지 않는다 — 기다리기를 포기할 뿐 산출물은 백그라운드에서 계속 만들어진다.
    # ⚠ 너무 크게 두면 S3·AI 서버가 느릴 때 요청 스레드가 그만큼 묶인다(ⓑ는 "전화가 안 끊긴다"가 된다).
    # ⚠ 환경마다 다르다 — 로컬→S3는 EC2→S3보다 느리므로 배포 서버 로그(uploadMs/elapsedMs)로 정할 것.
    wait-ms: 5000
  timeout:
    # 연결되지 못한 통화를 걷는 주기(ms). 벨 타임아웃보다 촘촘해야 판정이 제시간에 떨어진다.
    scheduler-delay-ms: 10000
    # 이 초만큼 벨이 울렸는데 안 받으면 부재중(MISSED). 기준 시각은 Call.createdAt(= 벨 울린 시각).
    ring-seconds: 60
    # 받았지만(PENDING) 이 초 안에 WebSocket을 열지 않으면 CANCELED. wsTicket TTL(30초) + 여유.
    # 기준 시각은 Call.acceptedAt(= 받은 시각) — ring-seconds와 원점이 달라 서로 독립이다.
    pending-seconds: 60
    # 발신했지만(DIALING) 이 초 안에 WebSocket을 열지 않으면 CANCELED. 기준 시각은 Call.createdAt.
    dial-seconds: 60
    # 이 분을 넘겨 진행 중인 통화는 COMPLETED로 마감하고 세션도 정리한다. 기준 시각은 Call.startedAt.
    # 크래시·SIGKILL·half-open으로 남은 통화를 걷는 안전망이자 통화 시간 상한이다.
    # 폴링 주기(scheduler-delay-ms)만큼 늦게 걷히므로 실제 마감은 상한보다 최대 10초 뒤다.
    max-call-minutes: 5

proactive:
  # 선제 연락은 시간 단위 간격이라 10분 단위 폴링이면 충분하다.
  scheduler-delay-ms: 600000

kakao:
  base-url: https://kapi.kakao.com

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}

# FCM 서비스계정 키
fcm:
  credentials-path: firebase/service-account.json
