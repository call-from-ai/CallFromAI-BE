spring:
  profiles:
    active: local
  config:
    import: optional:file:.env[.properties]
  jackson:
    time-zone: Asia/Seoul
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs
  default-consumes-media-type: application/json
  default-produces-media-type: application/json

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

clova:
  speech:
    host: clovaspeech-gw.ncloud.com
    port: 50051
    secret-key: ${CLOVA_SPEECH_SECRET}
    # 턴 끝 감지: 이만큼(ms) 침묵하면 final(epdType=gap) 확정. 지연 vs 조기컷의 다이얼 — 실사용하며 튜닝.
    gap-threshold-ms: 700
  voice:
    base-url: https://naveropenapi.apigw.ntruss.com
    client-id: ${CLOVA_VOICE_CLIENT_ID}
    client-secret: ${CLOVA_VOICE_CLIENT_SECRET}
    format: wav
    sampling-rate: 24000
    connect-timeout-ms: 2000
    read-timeout-ms: 10000

kakao:
  base-url: https://kapi.kakao.com

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    access-key: ${AWS_ACCESS_KEY_ID}
    secret-key: ${AWS_SECRET_ACCESS_KEY}
