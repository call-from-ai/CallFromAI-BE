spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false
  flyway:
    baseline-on-migrate: true
    baseline-version: 0

cors:
  allowed-origins: http://localhost:3000,http://localhost:5173

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://localhost:8081}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:60000}
    internal-token: ${AI_INTERNAL_TOKEN}

logging:
  level:
    org.hibernate.SQL: debug
